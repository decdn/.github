# Core label set applied to every decdn org repo.
# Source of truth: edit here, sync-labels workflow propagates to all repos.
# Colors are quoted to avoid YAML interpreting all-digit hex as integers.
- name: bug
  color: 'd73a4a'
  description: Something isn't working
- name: documentation
  color: '0075ca'
  description: Improvements or additions to documentation
- name: duplicate
  color: 'cfd3d7'
  description: This issue or pull request already exists
- name: enhancement
  color: 'a2eeef'
  description: New feature or request
- name: good first issue
  color: '7057ff'
  description: Good for newcomers
- name: help wanted
  color: '008672'
  description: Extra attention is needed
- name: invalid
  color: 'e4e669'
  description: This doesn't seem right
- name: question
  color: 'd876e3'
  description: Further information is requested
- name: wontfix
  color: 'ffffff'
  description: This will not be worked on
- name: blocked
  color: 'b60205'
  description: Blocked by open PRs or other dependencies
- name: security
  color: 'e11d48'
  description: Security-related issue
- name: dependencies
  color: '0366d6'
  description: Pull requests that update a dependency file
